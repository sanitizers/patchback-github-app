---

name: 🧪 tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest @ py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.14'
        - '3.13'
        - '3.9'
    steps:
    - uses: actions/checkout@v4
    - name: Switch to Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the test dependencies
      # NOTE: The suite needs nothing but pytest and git on top of the
      # NOTE: stdlib — `patchback.backport` imports no third-party code.
      # NOTE: Pinning this via pip-tools is left for when it grows deps.
      run: python -m pip install --upgrade pytest
    - name: Run the test suite
      run: python -m pytest

...
